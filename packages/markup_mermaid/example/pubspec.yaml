name: markup_mermaid_example
description: Example for Plugin to process Mermaid diagrams within a markup document.
homepage: https://github.com/islandlifetechnologies/markup/tree/main/packages/markup_mermaid/example
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  markup: ^1.0.0
  markup_common: ^1.0.0

dev_dependencies:
  build_runner: ^2.16.0
  embed: ^1.6.6
  ilt_lints: ^1.0.1
  json_serializable: ^6.14.1
  test: ^1.31.2

dependency_overrides:
  markup: 
    path: ../../markup
  markup_common: 
    path: ../../markup_common