name: Tag & Publish (Markup)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yaml
      - packages/markup/pubspec.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate
        shell: bash
        run: |
          set -e

          dart pub get
          dart format --set-exit-if-changed lib test
          dart run build_runner build
          dart analyze
          dart test
        working-directory: ./packages/markup

      - name: Compile Binary
        run: |
          dart compile exe bin/markup.dart -o bin/markup
        working-directory: ./packages/markup

      - name: Prepare Git
        shell: bash
        run: |
          set -e

          git config set user.name "${{ github.actor }}"
          git config set user.email "${{ github.actor_email }}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: bin
          path: outbin

      - name: Update Binary
        shell: bash
        run: |
          set -e

          mkdir -p outbin/linux/
          cp -f packages/markup/bin/markup outbin/linux/markup
          chmod +x outbin/linux/markup
          cd outbin
          git add .
          git commit -m "Update linux binary"
          git push

