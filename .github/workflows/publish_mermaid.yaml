name: Tag & Publish (Mermaid)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish_mermaid.yaml
      - packages/markup_mermaid/pubspec.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate
        shell: bash
        run: |
          set -e

          npm install -g @mermaid-js/mermaid-cli
          mmdc --help
          dart pub get
          dart format --set-exit-if-changed lib test
          dart run build_runner build
          dart analyze
          dart test
        working-directory: ./packages/markup_mermaid

      - name: Compile Binary
        run: |
          dart compile exe bin/markup_mermaid.dart -o bin/markup_mermaid
        working-directory: ./packages/markup_mermaid

      - name: Prepare Git
        shell: bash
        run: |
          set -e

          git config --global user.email "action@github.com"
          git config --global user.name "Github Action"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: bin
          path: outbin

      - name: Update Binary
        shell: bash
        run: |
          set -e

          mkdir -p outbin/linux/
          cp -f packages/markup_mermaid/bin/markup_mermaid outbin/linux/markup_mermaid
          chmod +x outbin/linux/markup_mermaid
          cd outbin
          git add .
          git commit --allow-empty -m "Update linux binary"
          git push

