name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [bin]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: islandlifetechnologies/markup@v1

      - shell: bash
        run: |
          markup --help
          markup_mermaid --help

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: islandlifetechnologies/markup@v1

      - shell: bash
        run: |
          markup --help
          markup_mermaid --help

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: islandlifetechnologies/markup@v1

      - shell: bash
        run: |
          markup --help
          markup_mermaid --help
