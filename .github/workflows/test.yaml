name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: bin
          path: bin

      - shell: bash
        run: |
          bin/linux/markup --help

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: bin
          path: bin

      - shell: bash
        run: |
          bin/macos/markup --help

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: bin
          path: bin

      - shell: bash
        run: |
          bin/windows/markup --help
