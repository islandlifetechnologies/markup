name: Test

on:
  workflow_dispatch:
  push:
    branches: [bin]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: bin
          path: bin

      - name: Update path to include Markup
        shell: bash
        run: |
          echo "$PWD/bin/linux" >> $GITHUB_PATH

      - shell: bash
        run: |
          markup --help
          markup_mermaid --help

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: bin
          path: bin

      - name: Update path to include Markup
        shell: bash
        run: |
          echo "$PWD/bin/macos" >> $GITHUB_PATH

      - shell: bash
        run: |
          markup --help
          markup_mermaid --help

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: bin
          path: bin

      - name: Update path to include Markup
        shell: bash
        run: |
          echo "$PWD/bin/windows" >> $GITHUB_PATH

      - shell: bash
        run: |
          markup --help
          markup_mermaid --help
