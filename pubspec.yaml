name: 'markup'
description: 'A Dart library for processing Markdown with various options.'
homepage: 'https://github.com/islandlifetechnologies/markup'
version: 1.0.0-alpha0

environment:
  sdk: ^3.13.0

executables: 
  markup: markup

dependencies:
  args: ^2.5.0
  convert: ^3.1.2
  embed_annotation: ^1.2.3
  file: ^7.0.1
  glob: ^2.1.3
  json_annotation: ^4.12.0
  json_class: ^3.0.1
  logging: ^1.3.0
  markdown: ^7.3.0
  meta: ^1.16.0
  mime: ^2.0.0
  path: ^1.9.1
  template_expressions: ^4.3.0
  uuid: ^4.5.2
  yaon: ^2.0.2

dev_dependencies:
  build_runner: ^2.16.0
  embed: ^1.6.6
  ilt_lints: ^1.0.1
  json_serializable: ^6.14.1
  test: ^1.31.2
